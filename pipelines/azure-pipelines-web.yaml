name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: acda-homolog
  - name: componentName
    value: web
  - name: containerAppName
    value: ca-web-acda-homolog
  - name: imageTag
    value: $(Build.BuildNumber)

stages:
  - stage: Build
    displayName: Build e testes
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            displayName: Instalar Node.js
            inputs:
              versionSpec: 22.x

          - script: npm ci --no-audit --no-fund
            displayName: npm ci

          - script: npm run build -- --configuration=homolog
            displayName: Build Angular

          - script: npm run test -- --watch=false --browsers=ChromeHeadless
            displayName: Testes unitarios

  - stage: Deploy
    displayName: Deploy em homologacao
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - job: Deploy
        steps:
          - task: Docker@2
            displayName: Build e push da imagem
            inputs:
              command: buildAndPush
              repository: $(componentName)
              dockerfile: docker/web/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              containerRegistry: $(containerRegistryConnection)
              tags: $(imageTag)
              arguments: --build-arg BUILD_CONFIGURATION=homolog --build-arg APP_NAME=web

          - task: AzureCLI@2
            displayName: Deploy no Container Apps
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: scripts/deploy-container-app.sh
              arguments: $(containerAppName) $(resourceGroupName) $(containerRegistryName) $(componentName) $(imageTag)

          - task: AzureCLI@2
            displayName: Smoke test
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: scripts/smoke-test.sh
              arguments: $(containerAppName) $(resourceGroupName)

          - task: AzureCLI@2
            displayName: Rollback
            condition: failed()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: scripts/rollback.sh
              arguments: $(containerAppName) $(resourceGroupName) $(previousRevision)
