name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: acda-homolog
  - name: componentName
    value: worker
  - name: containerAppName
    value: ca-worker-acda-homolog
  - name: imageTag
    value: $(Build.BuildNumber)

stages:
  - stage: Build
    displayName: Build e testes
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: Instalar .NET SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          - task: DotNetCoreCLI@2
            displayName: Restaurar dependencias
            inputs:
              command: restore
              projects: src/Worker/Worker.csproj

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: src/Worker/Worker.csproj
              arguments: --configuration Release --no-restore

          - task: DotNetCoreCLI@2
            displayName: Testes unitarios
            inputs:
              command: test
              projects: tests/Worker.Tests/Worker.Tests.csproj
              arguments: --configuration Release --no-build

  - stage: Deploy
    displayName: Deploy em homologacao
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - job: Deploy
        steps:
          - task: Docker@2
            displayName: Build e push da imagem
            inputs:
              command: buildAndPush
              repository: $(componentName)
              dockerfile: docker/worker/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              containerRegistry: $(containerRegistryConnection)
              tags: $(imageTag)

          - task: AzureCLI@2
            displayName: Deploy no Container Apps
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: pipelines/scripts/deploy-container-app.sh
            env:
              CONTAINER_APP_NAME: $(containerAppName)
              RESOURCE_GROUP: $(resourceGroupName)
              REGISTRY_NAME: $(containerRegistryName)
              COMPONENT_NAME: $(componentName)
              IMAGE_TAG: $(imageTag)

          - task: AzureCLI@2
            displayName: Smoke test
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: pipelines/scripts/smoke-test-worker.sh
            env:
              CONTAINER_APP_NAME: $(containerAppName)
              RESOURCE_GROUP: $(resourceGroupName)

          - task: AzureCLI@2
            displayName: Rollback
            condition: failed()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: pipelines/scripts/rollback-worker.sh
            env:
              CONTAINER_APP_NAME: $(containerAppName)
              RESOURCE_GROUP: $(resourceGroupName)
              PREVIOUS_REVISION: $(previousRevision)
